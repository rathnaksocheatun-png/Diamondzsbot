<style>
:root{--bg:#050B1E;--card:#0B1630;--b1:#126BFF;--b2:#20D9FF;--pu:#A855F7;--gd:#FFC857;--tx:#fff;--hint:#91A8CC;--line:rgba(32,217,255,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Khmer",sans-serif}
body{min-height:100vh;background:radial-gradient(90% 38% at 50% -4%,rgba(18,107,255,.55),transparent 70%),radial-gradient(60% 30% at 105% 22%,rgba(168,85,247,.22),transparent 70%),var(--bg) no-repeat}
#app{max-width:640px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 100px}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sh{to{background-position:200% 0}}
.card{background:linear-gradient(150deg,#0e1c3d,var(--card) 55%,#081027);border:1px solid var(--line);border-radius:18px;
 box-shadow:0 6px 24px rgba(0,0,0,.45),0 0 18px rgba(18,107,255,.2),inset 0 1px 0 rgba(255,255,255,.07);padding:14px;margin-bottom:12px;animation:up .35s both}
.top{display:flex;align-items:center;gap:12px}
.top img,.av{width:50px;height:50px;border-radius:50%;object-fit:cover;background:var(--card);border:2px solid var(--b2);
 box-shadow:0 0 0 3px rgba(168,85,247,.35),0 0 16px rgba(32,217,255,.6);display:flex;align-items:center;justify-content:center;font-weight:800}
.grow{flex:1;min-width:0}.nm{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis}.sub{color:var(--hint);font-size:13px}
.big{font-size:30px;font-weight:800;color:var(--gd);text-shadow:0 0 18px rgba(255,200,87,.55)}
.btn{border:0;border-radius:13px;padding:12px 18px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;
 background:linear-gradient(100deg,var(--b1),var(--b2));box-shadow:0 4px 18px rgba(32,217,255,.45)}
.btn.gold{background:linear-gradient(100deg,var(--gd),#ffe3a3);color:#1b1300;box-shadow:0 4px 18px rgba(255,200,87,.5)}
.btn.s{padding:8px 15px;font-size:13px}.btn.alt{background:#0b1630;box-shadow:none;border:1px solid var(--line)}.btn.w{width:100%;margin-top:10px}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
h3{margin:18px 2px 10px;font-size:16px;display:flex;align-items:center;gap:8px}
h3:before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(var(--b2),var(--pu))}
.row{display:flex;align-items:center;gap:10px}
.hs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.tile{flex:0 0 auto;width:96px;text-align:center;padding:12px 6px;font-size:13px;cursor:pointer}.tile b{display:block;font-size:30px;margin-bottom:4px}
.tile:active,.card.buy:active{transform:scale(.97)}
.gg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.gg .tile{width:auto;padding:22px 8px}
.pk{padding:12px 14px}.pk .pn{flex:1;font-size:14px;font-weight:600}.pk .pp{font-weight:800;color:var(--b2);margin-right:6px;text-shadow:0 0 12px rgba(32,217,255,.5)}
.chip{border:1px solid var(--line);background:none;color:var(--tx);border-radius:999px;padding:8px 15px;font-size:13px}
.chip.on{background:linear-gradient(100deg,var(--b1),var(--pu));border-color:transparent;box-shadow:0 0 14px rgba(168,85,247,.55)}
.tag{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(168,85,247,.25);color:#e3c8ff}
.tag.completed{background:rgba(32,217,255,.18);color:var(--b2)}.tag.cancelled{background:rgba(255,107,107,.18);color:#ff9a9a}
.pos{color:#3be8a2}.neg{color:#ff7b8a}.note{color:var(--hint);font-size:13px;text-align:center;padding:16px;line-height:1.6}
.banner{background:linear-gradient(110deg,var(--b1),var(--pu),var(--b2),var(--b1));background-size:200% 100%;animation:sh 6s linear infinite;
 border:0;font-weight:800;text-align:center;font-size:16px;text-shadow:0 1px 8px rgba(0,0,0,.4);box-shadow:0 6px 26px rgba(168,85,247,.45)}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(5,11,30,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{display:flex;width:100%;max-width:640px}nav button{flex:1;background:none;border:0;color:var(--hint);padding:10px 0 8px;font-size:11px;position:relative}
nav button b{display:block;font-size:21px}nav button.on{color:#fff;text-shadow:0 0 10px var(--b2)}
nav button.on:before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--b2),var(--pu));box-shadow:0 0 10px var(--b2)}
.ov{position:fixed;inset:0;background:rgba(2,5,14,.75);backdrop-filter:blur(4px);display:flex;align-items:flex-end;z-index:9}
.sheet{width:100%;max-width:640px;margin:0 auto;background:linear-gradient(180deg,#0e1c3d,#060d22);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
 padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;box-shadow:0 -10px 40px rgba(18,107,255,.3)}
.sheet input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#081027;color:#fff;font-size:16px;margin-top:4px;outline:0}
.sheet input:focus{border-color:var(--b2);box-shadow:0 0 12px rgba(32,217,255,.4)}
.sheet label{display:block;font-size:13px;color:var(--hint);margin-top:10px}.msg{margin-top:10px;font-size:14px;line-height:1.5}.err{color:#ff7b8a}.ok{color:#3be8a2}

/* ---- premium layer ---- */
@keyframes fl{0%,100%{transform:translate(0,0)}50%{transform:translate(24px,30px)}}
@keyframes sw{to{left:140%}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
body:before,body:after{content:"";position:fixed;z-index:0;border-radius:50%;filter:blur(70px);pointer-events:none;animation:fl 9s ease-in-out infinite}
body:before{width:260px;height:260px;left:-80px;top:120px;background:rgba(18,107,255,.45)}
body:after{width:240px;height:240px;right:-70px;bottom:140px;background:rgba(168,85,247,.38);animation-delay:-4s}
#app{position:relative;z-index:1}
.card{border:1px solid transparent;background:linear-gradient(150deg,#0e1c3d,#0B1630 55%,#081027) padding-box,linear-gradient(135deg,rgba(32,217,255,.7),rgba(168,85,247,.45),rgba(255,200,87,.35)) border-box}
.btn:not(.alt){position:relative;overflow:hidden}
.btn:not(.alt):after{content:"";position:absolute;top:0;left:-60%;width:36%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:sw 3.4s ease-in-out infinite}
.hero{position:relative;overflow:hidden;padding:18px 14px;background:linear-gradient(135deg,rgba(18,107,255,.35),rgba(168,85,247,.2)) padding-box,linear-gradient(135deg,var(--b2),var(--pu),var(--gd)) border-box}
.hero img{width:62px;height:62px}.brand{font-size:22px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#fff,var(--b2) 60%,var(--pu));-webkit-background-clip:text;background-clip:text;color:transparent}
.gem{position:absolute;right:64px;top:2px;opacity:.5;animation:bob 3.5s ease-in-out infinite;pointer-events:none}
.wallet{position:relative;overflow:hidden;padding:18px 16px;background:linear-gradient(135deg,#1a2550,#0B1630 60%,#1b1840) padding-box,linear-gradient(135deg,var(--gd),rgba(255,200,87,.15) 45%,var(--b2)) border-box}
.wallet:after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,200,87,.18),transparent);transform:skewX(-20deg);animation:sw 5s ease-in-out infinite;pointer-events:none}
.gl{color:var(--gd);letter-spacing:1.5px;font-size:11px;font-weight:700;text-transform:uppercase}.wallet .big{font-size:34px}
.pk{box-shadow:0 6px 24px rgba(0,0,0,.45),inset 4px 0 0 var(--b2)}.pk .pn{font-size:15px}
h3{font-size:17px;letter-spacing:.3px;margin-top:22px}
.tile{box-shadow:0 8px 26px rgba(0,0,0,.5),0 0 20px rgba(18,107,255,.25)}.tile b{filter:drop-shadow(0 0 10px rgba(32,217,255,.7))}

/* ---- bright glass theme ---- */
:root{--hint:#dbeaff;--line:rgba(255,255,255,.4)}
body{background:radial-gradient(70% 38% at 15% 0,rgba(255,255,255,.6),transparent 62%),radial-gradient(60% 36% at 105% 28%,rgba(120,225,255,.55),transparent 62%),linear-gradient(180deg,#5cc0ff 0,#2b7bff 38%,#0c2fa8 100%) fixed}

 backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 32px rgba(4,20,100,.38),inset 0 1px 0 rgba(255,255,255,.55)}

.nm,.sub,h3{text-shadow:0 1px 6px rgba(4,20,100,.45)}.pk .pp{color:#fff;text-shadow:0 0 12px rgba(32,217,255,.9)}.pk{box-shadow:0 8px 26px rgba(4,20,100,.35),inset 4px 0 0 #fff}

 /* no frame: all four edges melt softly into the page (sides 7%, top 5%, bottom 7%) - raise a number for a softer edge */
 -webkit-mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent),linear-gradient(to bottom,transparent,#000 5%,#000 93%,transparent);-webkit-mask-composite:source-in;
 mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent),linear-gradient(to bottom,transparent,#000 5%,#000 93%,transparent);mask-composite:intersect}
/* ---- animations on every button ---- */
@keyframes pu{0%,100%{box-shadow:0 4px 14px rgba(32,217,255,.45)}50%{box-shadow:0 4px 28px rgba(32,217,255,1)}}
@keyframes pg{0%,100%{box-shadow:0 4px 14px rgba(255,200,87,.45)}50%{box-shadow:0 4px 28px rgba(255,200,87,1)}}
@keyframes pa{0%,100%{box-shadow:0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 16px rgba(255,255,255,.55)}}
@keyframes fy{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.btn:not(.alt):not(.gold){animation:pu 2.3s ease-in-out infinite}.btn.gold{animation:pg 2.3s ease-in-out infinite}.btn.alt{animation:pa 3s ease-in-out infinite}
.chip{animation:pa 3.2s ease-in-out infinite}.chip.on{animation:pu 2.3s ease-in-out infinite}
.tile{animation:up .4s both,fy 5s ease-in-out infinite}.tile:nth-child(2n){animation-delay:0s,-2.2s}.tile:nth-child(3n){animation-delay:0s,-3.6s}
nav button.on b{animation:fy 1.8s ease-in-out infinite}button{transition:transform .12s}button:active,.tile:active{transform:scale(.92)!important}
/* ---- falling diamonds ---- */
#snow{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
#snow span{position:absolute;top:-30px;animation:fall linear infinite,sway ease-in-out infinite alternate;filter:drop-shadow(0 0 5px rgba(255,255,255,.8))}
@keyframes fall{to{transform:translateY(115vh) rotate(40deg)}}@keyframes sway{from{translate:-16px 0}to{translate:16px 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}#snow{display:none}}

@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(70px)}}
body{background:radial-gradient(60% 30% at 20% 4%,rgba(255,255,255,.75),transparent 65%),radial-gradient(50% 26% at 90% 40%,rgba(255,255,255,.35),transparent 65%),radial-gradient(70% 30% at 30% 100%,rgba(255,255,255,.4),transparent 70%),linear-gradient(180deg,#8fdcff 0,#46a3ff 30%,#2262ee 65%,#1237b8 100%) fixed}

/* ---- clear status labels ---- */
.tag{padding:5px 14px;font-weight:800;font-size:13px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.7);background:linear-gradient(180deg,#b98bff,#7a3fe0);box-shadow:0 2px 8px rgba(40,10,120,.4)}
.tag.completed{background:linear-gradient(180deg,#3deba5,#0a9a60);color:#fff}
.tag.cancelled{background:linear-gradient(180deg,#ff8c9c,#d62e4d);color:#fff}
.chip{background:rgba(10,40,150,.45);border-color:rgba(255,255,255,.65)}.chip.on{background:linear-gradient(100deg,#126BFF,#A855F7)}

/* ---- smooth buttons (only transform/opacity are animated) ---- */
@keyframes halo{0%,100%{opacity:.25;transform:scale(.97)}50%{opacity:.95;transform:scale(1.07)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes sheen{from{background-position:210% 0,0 0}to{background-position:-110% 0,0 0}}
@keyframes flowY{0%,100%{transform:translateY(-10%)}50%{transform:translateY(10%)}}
.btn{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.btn:not(.alt){position:relative;isolation:isolate;overflow:visible;will-change:transform}
.btn:not(.alt):not(.gold){--gc:rgba(32,217,255,.95);background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.6) 50%,transparent 62%) 210% 0/250% 100% no-repeat,linear-gradient(180deg,#7be8ff,#2a95ff 50%,#126BFF);
 box-shadow:0 5px 0 #0a3fb0,inset 0 2px 0 rgba(255,255,255,.75);animation:breathe 2.6s ease-in-out infinite,sheen 3.4s ease-in-out infinite}
.btn.gold{--gc:rgba(255,200,87,.95);background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.75) 50%,transparent 62%) 210% 0/250% 100% no-repeat,linear-gradient(180deg,#fff1c2,#ffc857 55%,#f3a81d);
 box-shadow:0 5px 0 #a8730a,inset 0 2px 0 rgba(255,255,255,.85);animation:breathe 2.8s ease-in-out infinite,sheen 3.8s ease-in-out infinite}
.btn:not(.alt):before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;box-shadow:0 0 22px 5px var(--gc);animation:halo 2.2s ease-in-out infinite;will-change:transform,opacity}
.btn:not(.alt):after{content:none}
.btn.alt,.chip,.chip.on{animation:none}.btn.alt{box-shadow:0 4px 0 rgba(255,255,255,.2),inset 0 1px 0 rgba(255,255,255,.7)}
.chip.on{box-shadow:0 0 14px rgba(168,85,247,.6)}
#flow{inset:-25% 0;background-size:100% 100%;animation:flowY 9s ease-in-out infinite;will-change:transform}
.wv,#gembig{will-change:transform}
.card{animation:up .55s cubic-bezier(.2,.8,.2,1) both}#app>.card:nth-child(2){animation-delay:0.06s}#app>.card:nth-child(3){animation-delay:0.12s}#app>.card:nth-child(4){animation-delay:0.18s}#app>.card:nth-child(5){animation-delay:0.24s}#app>.card:nth-child(6){animation-delay:0.30s}#app>.card:nth-child(7){animation-delay:0.36s}#app>.card:nth-child(8){animation-delay:0.42s}#app>.card:nth-child(9){animation-delay:0.48s}

/* ---- on-screen number pad (pink) ---- */
.sheet input[readonly]{font-size:22px;font-weight:800;letter-spacing:2px;min-height:52px;caret-color:transparent}
.sheet input.act{border-color:#ff8fd0;box-shadow:0 0 16px rgba(255,105,180,.8)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.key{border:1px solid rgba(255,255,255,.85);border-radius:16px;min-height:52px;font-size:24px;font-weight:800;color:#fff;cursor:pointer;
 background:linear-gradient(180deg,#ffd0ec,#ff6fbe 55%,#ea3fa3);text-shadow:0 1px 3px rgba(150,0,90,.7);
 box-shadow:0 5px 0 #b3217a,0 8px 18px rgba(255,105,180,.55),inset 0 2px 0 rgba(255,255,255,.85);transition:transform .12s,box-shadow .12s}
.key.fn{background:linear-gradient(180deg,#ffc0f0,#c957ff 55%,#9d34e0);box-shadow:0 5px 0 #6c1fa8,0 8px 18px rgba(201,87,255,.55),inset 0 2px 0 rgba(255,255,255,.85);font-size:21px}
.key:active{transform:translateY(4px) scale(.97)!important;box-shadow:0 1px 0 #b3217a,inset 0 2px 0 rgba(255,255,255,.6)}

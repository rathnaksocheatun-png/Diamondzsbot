<style>
:root{--bg:#050B1E;--card:#0B1630;--b1:#126BFF;--b2:#20D9FF;--pu:#A855F7;--gd:#FFC857;--tx:#fff;--hint:#91A8CC;--line:rgba(32,217,255,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Khmer",sans-serif}
body{min-height:100vh;background:radial-gradient(90% 38% at 50% -4%,rgba(18,107,255,.55),transparent 70%),radial-gradient(60% 30% at 105% 22%,rgba(168,85,247,.22),transparent 70%),var(--bg) no-repeat}
#app{max-width:640px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 100px}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sh{to{background-position:200% 0}}
.card{background:linear-gradient(150deg,#0e1c3d,var(--card) 55%,#081027);border:1px solid var(--line);border-radius:18px;
 box-shadow:0 6px 24px rgba(0,0,0,.45),0 0 18px rgba(18,107,255,.2),inset 0 1px 0 rgba(255,255,255,.07);padding:14px;margin-bottom:12px;animation:up .35s both}
.top{display:flex;align-items:center;gap:12px}
.top img,.av{width:50px;height:50px;border-radius:50%;object-fit:cover;background:var(--card);border:2px solid var(--b2);
 box-shadow:0 0 0 3px rgba(168,85,247,.35),0 0 16px rgba(32,217,255,.6);display:flex;align-items:center;justify-content:center;font-weight:800}
.grow{flex:1;min-width:0}.nm{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis}.sub{color:var(--hint);font-size:13px}
.big{font-size:30px;font-weight:800;color:var(--gd);text-shadow:0 0 18px rgba(255,200,87,.55)}
.btn{border:0;border-radius:13px;padding:12px 18px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;
 background:linear-gradient(100deg,var(--b1),var(--b2));box-shadow:0 4px 18px rgba(32,217,255,.45)}
.btn.gold{background:linear-gradient(100deg,var(--gd),#ffe3a3);color:#1b1300;box-shadow:0 4px 18px rgba(255,200,87,.5)}
.btn.s{padding:8px 15px;font-size:13px}.btn.alt{background:#0b1630;box-shadow:none;border:1px solid var(--line)}.btn.w{width:100%;margin-top:10px}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
h3{margin:18px 2px 10px;font-size:16px;display:flex;align-items:center;gap:8px}
h3:before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(var(--b2),var(--pu))}
.row{display:flex;align-items:center;gap:10px}
.hs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.tile{flex:0 0 auto;width:96px;text-align:center;padding:12px 6px;font-size:13px;cursor:pointer}.tile b{display:block;font-size:30px;margin-bottom:4px}
.tile:active,.card.buy:active{transform:scale(.97)}
.gg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.gg .tile{width:auto;padding:22px 8px}
.pk{padding:12px 14px}.pk .pn{flex:1;font-size:14px;font-weight:600}.pk .pp{font-weight:800;color:var(--b2);margin-right:6px;text-shadow:0 0 12px rgba(32,217,255,.5)}
.chip{border:1px solid var(--line);background:none;color:var(--tx);border-radius:999px;padding:8px 15px;font-size:13px}
.chip.on{background:linear-gradient(100deg,var(--b1),var(--pu));border-color:transparent;box-shadow:0 0 14px rgba(168,85,247,.55)}
.tag{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(168,85,247,.25);color:#e3c8ff}
.tag.completed{background:rgba(32,217,255,.18);color:var(--b2)}.tag.cancelled{background:rgba(255,107,107,.18);color:#ff9a9a}
.pos{color:#3be8a2}.neg{color:#ff7b8a}.note{color:var(--hint);font-size:13px;text-align:center;padding:16px;line-height:1.6}
.banner{background:linear-gradient(110deg,var(--b1),var(--pu),var(--b2),var(--b1));background-size:200% 100%;animation:sh 6s linear infinite;
 border:0;font-weight:800;text-align:center;font-size:16px;text-shadow:0 1px 8px rgba(0,0,0,.4);box-shadow:0 6px 26px rgba(168,85,247,.45)}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(5,11,30,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{display:flex;width:100%;max-width:640px}nav button{flex:1;background:none;border:0;color:var(--hint);padding:10px 0 8px;font-size:11px;position:relative}
nav button b{display:block;font-size:21px}nav button.on{color:#fff;text-shadow:0 0 10px var(--b2)}
nav button.on:before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--b2),var(--pu));box-shadow:0 0 10px var(--b2)}
.ov{position:fixed;inset:0;background:rgba(2,5,14,.75);backdrop-filter:blur(4px);display:flex;align-items:flex-end;z-index:9}
.sheet{width:100%;max-width:640px;margin:0 auto;background:linear-gradient(180deg,#0e1c3d,#060d22);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
 padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;box-shadow:0 -10px 40px rgba(18,107,255,.3)}
.sheet input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#081027;color:#fff;font-size:16px;margin-top:4px;outline:0}
.sheet input:focus{border-color:var(--b2);box-shadow:0 0 12px rgba(32,217,255,.4)}
.sheet label{display:block;font-size:13px;color:var(--hint);margin-top:10px}.msg{margin-top:10px;font-size:14px;line-height:1.5}.err{color:#ff7b8a}.ok{color:#3be8a2}

/* ---- premium layer ---- */
@keyframes fl{0%,100%{transform:translate(0,0)}50%{transform:translate(24px,30px)}}
@keyframes sw{to{left:140%}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
body:before,body:after{content:"";position:fixed;z-index:0;border-radius:50%;filter:blur(70px);pointer-events:none;animation:fl 9s ease-in-out infinite}
body:before{width:260px;height:260px;left:-80px;top:120px;background:rgba(18,107,255,.45)}
body:after{width:240px;height:240px;right:-70px;bottom:140px;background:rgba(168,85,247,.38);animation-delay:-4s}
#app{position:relative;z-index:1}
.card{border:1px solid transparent;background:linear-gradient(150deg,#0e1c3d,#0B1630 55%,#081027) padding-box,linear-gradient(135deg,rgba(32,217,255,.7),rgba(168,85,247,.45),rgba(255,200,87,.35)) border-box}
.btn:not(.alt){position:relative;overflow:hidden}
.btn:not(.alt):after{content:"";position:absolute;top:0;left:-60%;width:36%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:sw 3.4s ease-in-out infinite}
.hero{position:relative;overflow:hidden;padding:18px 14px;background:linear-gradient(135deg,rgba(18,107,255,.35),rgba(168,85,247,.2)) padding-box,linear-gradient(135deg,var(--b2),var(--pu),var(--gd)) border-box}
.hero img{width:62px;height:62px}.brand{font-size:22px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#fff,var(--b2) 60%,var(--pu));-webkit-background-clip:text;background-clip:text;color:transparent}
.gem{position:absolute;right:64px;top:2px;opacity:.5;animation:bob 3.5s ease-in-out infinite;pointer-events:none}
.wallet{position:relative;overflow:hidden;padding:18px 16px;background:linear-gradient(135deg,#1a2550,#0B1630 60%,#1b1840) padding-box,linear-gradient(135deg,var(--gd),rgba(255,200,87,.15) 45%,var(--b2)) border-box}
.wallet:after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,200,87,.18),transparent);transform:skewX(-20deg);animation:sw 5s ease-in-out infinite;pointer-events:none}
.gl{color:var(--gd);letter-spacing:1.5px;font-size:11px;font-weight:700;text-transform:uppercase}.wallet .big{font-size:34px}
.pk{box-shadow:0 6px 24px rgba(0,0,0,.45),inset 4px 0 0 var(--b2)}.pk .pn{font-size:15px}
h3{font-size:17px;letter-spacing:.3px;margin-top:22px}
.tile{box-shadow:0 8px 26px rgba(0,0,0,.5),0 0 20px rgba(18,107,255,.25)}.tile b{filter:drop-shadow(0 0 10px rgba(32,217,255,.7))}

/* ---- bright glass theme ---- */
:root{--hint:#dbeaff;--line:rgba(255,255,255,.4)}
body{background:radial-gradient(70% 38% at 15% 0,rgba(255,255,255,.6),transparent 62%),radial-gradient(60% 36% at 105% 28%,rgba(120,225,255,.55),transparent 62%),linear-gradient(180deg,#5cc0ff 0,#2b7bff 38%,#0c2fa8 100%) fixed}

 backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 32px rgba(4,20,100,.38),inset 0 1px 0 rgba(255,255,255,.55)}

/* ---- animations on every button ---- */
@keyframes pu{0%,100%{box-shadow:0 4px 14px rgba(32,217,255,.45)}50%{box-shadow:0 4px 28px rgba(32,217,255,1)}}
@keyframes pg{0%,100%{box-shadow:0 4px 14px rgba(255,200,87,.45)}50%{box-shadow:0 4px 28px rgba(255,200,87,1)}}
@keyframes pa{0%,100%{box-shadow:0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 16px rgba(255,255,255,.55)}}
@keyframes fy{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.btn:not(.alt):not(.gold){animation:pu 2.3s ease-in-out infinite}.btn.gold{animation:pg 2.3s ease-in-out infinite}.btn.alt{animation:pa 3s ease-in-out infinite}
.chip{animation:pa 3.2s ease-in-out infinite}.chip.on{animation:pu 2.3s ease-in-out infinite}
.tile{animation:up .4s both,fy 5s ease-in-out infinite}.tile:nth-child(2n){animation-delay:0s,-2.2s}.tile:nth-child(3n){animation-delay:0s,-3.6s}
nav button.on b{animation:fy 1.8s ease-in-out infinite}button{transition:transform .12s}button:active,.tile:active{transform:scale(.92)!important}
/* ---- falling diamonds ---- */
#snow{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
#snow span{position:absolute;top:-30px;animation:fall linear infinite,sway ease-in-out infinite alternate;filter:drop-shadow(0 0 5px rgba(255,255,255,.8))}
@keyframes fall{to{transform:translateY(115vh) rotate(40deg)}}@keyframes sway{from{translate:-16px 0}to{translate:16px 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}#snow{display:none}}

@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(70px)}}
body{background:radial-gradient(60% 30% at 20% 4%,rgba(255,255,255,.75),transparent 65%),radial-gradient(50% 26% at 90% 40%,rgba(255,255,255,.35),transparent 65%),radial-gradient(70% 30% at 30% 100%,rgba(255,255,255,.4),transparent 70%),linear-gradient(180deg,#8fdcff 0,#46a3ff 30%,#2262ee 65%,#1237b8 100%) fixed}

 background:linear-gradient(160deg,rgba(255,255,255,.36),rgba(255,255,255,.1) 45%,rgba(255,255,255,.18)) padding-box,linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,.2) 40%,rgba(120,220,255,.85)) border-box;

 background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.65);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);

 timers.push(setInterval(function(){fetch("/api/deposit_status?id="+d.id,{headers:{"X-Init-Data":tg.initData},cache:"no-store"}).then(function(r){return r.json()}).then(function(x){
  if(x.status==="approved"){stopT();st.bal=x.balance_cents;st.acct=null;m.textContent=T("paid");m.className="msg ok";draw();try{tg.HapticFeedback.notificationOccurred("success")}catch(e){}}
  else if(x.status==="rejected"){stopT();m.textContent=T("expired");m.className="msg err"}}).catch(function(){})},4000));
 var c=el("button","btn alt w",T("cancelq"));c.onclick=function(){stopT();api("/api/deposit_cancel",{id:d.id}).then(shut,shut)};b.appendChild(c)}
function depositSheet(){var b=mk();b.appendChild(el("h3","",T("deposit")));var pre=el("div","hs");var amt=el("input");amt.type="number";amt.inputMode="decimal";amt.step="0.01";
 [1,5,10,20].forEach(function(v){var c=el("button","chip","$"+v);c.onclick=function(){amt.value=v};pre.appendChild(c)});b.appendChild(pre);
 b.appendChild(el("label","",T("amount")));b.appendChild(amt);var m=el("div","msg");b.appendChild(m);var go=el("button","btn w",T("makeqr"));b.appendChild(go);
 var no=el("button","btn alt w",T("close"));no.onclick=shut;b.appendChild(no);
 function bad(k){go.disabled=false;m.textContent=(E[k]||E.error)[st.lang];m.className="msg err"}
 go.onclick=function(){var c=Math.round(parseFloat(amt.value)*100);if(!(c>0)){bad("bad_amount");return}go.disabled=true;m.textContent="…";m.className="msg";
  api("/api/deposit",{amount_cents:c}).then(function(d){if(d.ok)showQR(b,d);else bad(d.error)}).catch(function(){bad("error")})}}
function pkg(p,g){var c=el("div","card pk row");
 if(p.img){var im=el("img");im.src="/pimg/"+p.id;im.alt="";im.style.cssText="width:46px;height:46px;border-radius:10px;object-fit:cover;flex:0 0 auto;box-shadow:0 0 10px #1d6bff88";c.appendChild(im);c.appendChild(el("div","pn",p.name))}
 else c.appendChild(el("div","pn",p.emoji+" "+p.name));c.appendChild(el("div","pp",money(p.price_cents)));
 if(can()){var b=el("button","btn s",T("buy"));b.onclick=function(){buy(p,g)};c.appendChild(b)}return c}
function gameTile(g,open){var t=el("div","card tile");
 if(g.img){t.style.cssText="padding:0;overflow:hidden;position:relative;aspect-ratio:4/3";var im=el("img");im.src="/img/"+encodeURIComponent(g.code);im.alt="";im.style.cssText="position:absolute;inset:0;width:100%;height:100%;object-fit:cover";t.appendChild(im);
  var sp=el("span","",g.name);sp.style.cssText="position:absolute;left:0;right:0;bottom:0;padding:20px 6px 7px;background:linear-gradient(transparent,#000d);font-weight:700;font-size:13px;text-shadow:0 0 6px #000";t.appendChild(sp)}
 else{t.appendChild(el("b","",g.emoji));t.appendChild(el("span","",g.name))}
 t.onclick=function(){st.tab="store";st.game=g.code;draw();window.scrollTo(0,0)};return t}
function head(){var w=el("div");if(st.tab==="home"){var bi=el("img","hb");bi.src="/banner.jpg?v=2";bi.alt="Diamond ZS";bi.onerror=function(){this.style.display="none"};w.appendChild(bi);
  var v=document.createElement("video");v.className="hb";v.muted=true;v.loop=true;v.autoplay=true;v.playsInline=true;v.setAttribute("playsinline","");v.poster="/banner.jpg?v=2";v.preload="auto";v.style.display="none";
  v.oncanplay=function(){v.style.display="block";bi.style.display="none";var q=v.play();if(q&&q.catch)q.catch(function(){})};v.src="/banner.mp4?v=2";w.appendChild(v)}
 var c=el("div","card top hero");var im=el("img");im.src="/logo.png";im.alt="";im.onerror=function(){this.style.display="none"};c.appendChild(im);
 var g=el("div","grow");g.appendChild(el("div","nm brand","DIAMOND ZS"));g.appendChild(el("div","sub",T("tag")));c.appendChild(g);
 var gem=el("div","gem");gem.innerHTML='<svg viewBox="0 0 64 64" width="66" height="66"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#20D9FF"/><stop offset="1" stop-color="#A855F7"/></linearGradient></defs><path d="M12 24 24 10h16l12 14-20 30z" fill="url(#gg)"/><path d="M12 24h40M24 10l8 14 8-14M32 54 24 24M32 54l8-30" stroke="#fff" stroke-opacity=".6" fill="none" stroke-width="1.5"/></svg>';c.appendChild(gem);
 var l=el("button","btn s alt",T("lg"));l.onclick=function(){st.lang=1-st.lang;draw()};c.appendChild(l);w.appendChild(c);return w}
function balCard(){var c=el("div","card row wallet");var g=el("div","grow");g.appendChild(el("div","sub gl",T("bal")));g.appendChild(el("div","big",st.bal===null?"—":money(st.bal)));c.appendChild(g);
 if(st.signed){var b=el("button","btn gold",T("deposit"));b.onclick=function(){if(st.pay)depositSheet();else notice(T("dep"))};c.appendChild(b)}return c}
function gate(box){if(st.signed)return false;box.appendChild(el("div","note",T("bn")));
 if(st.bot){var a=el("a","btn w",T("ob"));a.href="https://t.me/"+encodeURIComponent(st.bot);a.target="_blank";a.style.cssText="display:block;text-align:center;text-decoration:none";box.appendChild(a)}return true}
function home(box){var u=el("div","card top");var a=el("div","av",((st.acct&&st.acct.name)||"D").charAt(0).toUpperCase());u.appendChild(a);
 var g=el("div","grow");g.appendChild(el("div","nm",(st.acct&&st.acct.name)||"Diamond ZS"));if(st.acct&&st.acct.tg_id)g.appendChild(el("div","sub","ID: "+st.acct.tg_id));u.appendChild(g);
 if(st.signed)box.appendChild(u);box.appendChild(balCard());
 if(st.banner){var bn=el("div","card banner",st.banner);box.appendChild(bn)}
 box.appendChild(el("h3","",T("games")));var h=el("div","hs");st.games.slice(0,10).forEach(function(g){h.appendChild(gameTile(g))});box.appendChild(h);
 box.appendChild(el("h3","",T("hot")));var n=0;st.games.forEach(function(g){g.products.slice(0,2).forEach(function(p){if(n++<4)box.appendChild(pkg(p,g))})})}
function store(box){if(!st.games.length){box.appendChild(el("div","note",T("empty")));return}
 var g=st.games.filter(function(x){return x.code===st.game})[0];
 if(!g){var gr=el("div","gg");st.games.forEach(function(x){gr.appendChild(gameTile(x))});box.appendChild(gr);return}
 var b=el("button","btn s alt",T("back"));b.onclick=function(){st.game=null;draw()};box.appendChild(b);box.appendChild(el("h3","",g.emoji+" "+g.name));
 g.products.forEach(function(p){box.appendChild(pkg(p,g))})}
function when(s){return(s||"").slice(0,16)}
function wallet(box){if(gate(box))return;box.appendChild(balCard());box.appendChild(el("h3","",T("hist")));var t=(st.acct&&st.acct.transactions)||[];
 if(!t.length)box.appendChild(el("div","note",T("none")));
 t.forEach(function(x){var c=el("div","card row");var g=el("div","grow");g.appendChild(el("div","nm",T(x.type==="deposit"?"deposit_t":x.type)));g.appendChild(el("div","sub",when(x.created_at)));c.appendChild(g);
  c.appendChild(el("div",x.amount_cents>=0?"pos nm":"neg nm",(x.amount_cents>=0?"+":"-")+money(Math.abs(x.amount_cents))));box.appendChild(c)})}
function orders(box){if(gate(box))return;var f=el("div","hs");["all","pending","completed"].forEach(function(k){var c=el("button","chip"+(st.filter===k?" on":""),T(k));c.onclick=function(){st.filter=k;draw()};f.appendChild(c)});box.appendChild(f);
 var o=((st.acct&&st.acct.orders)||[]).filter(function(x){return st.filter==="all"||x.status===st.filter});
 if(!o.length)box.appendChild(el("div","note",T("none")));
 o.forEach(function(x){var c=el("div","card");var r=el("div","row");var g=el("div","grow");g.appendChild(el("div","nm","#"+x.id+" · "+x.name));g.appendChild(el("div","sub",x.game+" · "+when(x.created_at)));r.appendChild(g);
  r.appendChild(el("div","nm",money(x.price_cents)));c.appendChild(r);var tg2=el("span","tag "+x.status,T(x.status));tg2.style.cssText="display:inline-block;margin-top:8px";c.appendChild(tg2);box.appendChild(c)})}
function profile(box){if(gate(box))return;var a=st.acct||{};var c=el("div","card top");c.appendChild(el("div","av",(a.name||"?").charAt(0).toUpperCase()));
 var g=el("div","grow");g.appendChild(el("div","nm",a.name||""));if(a.username)g.appendChild(el("div","sub","@"+a.username));c.appendChild(g);box.appendChild(c);box.appendChild(balCard());
 var s=el("div","card row");[[T("tord"),a.total_orders||0],[T("tsp"),money(a.total_spent_cents||0)]].forEach(function(p){var d=el("div","grow");d.appendChild(el("div","sub",p[0]));d.appendChild(el("div","nm",String(p[1])));s.appendChild(d)});box.appendChild(s);
 var l=el("div","card row");l.appendChild(el("div","grow",T("lang")));var b=el("button","btn s alt",T("lg"));b.onclick=function(){st.lang=1-st.lang;draw()};l.appendChild(b);box.appendChild(l);
 box.appendChild(el("div","note",T("about")))}
var TABS=[["home","🏠"],["store","🛍"],["wallet","👛"],["orders","🧾"],["profile","👤"]];
function draw(){var app=document.getElementById("app");app.textContent="";document.documentElement.lang=st.lang?"en":"km";
 if(st.failed){app.appendChild(el("div","note",T("err")));var r=el("button","btn w",T("retry"));r.onclick=load;app.appendChild(r)}
 else{app.appendChild(head());({home:home,store:store,wallet:wallet,orders:orders,profile:profile})[st.tab](app)}
 var nav=document.getElementById("nav");nav.textContent="";
 TABS.forEach(function(t){var b=el("button",st.tab===t[0]?"on":"");b.appendChild(el("b","",t[1]));b.appendChild(document.createTextNode(T(t[0])));
  b.onclick=function(){st.tab=t[0];if(t[0]!=="store")st.game=null;draw();window.scrollTo(0,0);if(st.signed&&!st.acct)account()};nav.appendChild(b)})}
function account(){fetch("/api/account",{headers:{"X-Init-Data":tg.initData},cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
 if(d&&d.tg_id){st.acct=d;if(d.balance_cents!=null)st.bal=d.balance_cents;draw()}}).catch(function(){})}
function load(){st.failed=false;document.getElementById("app").textContent="…";
 fetch("/api/catalog",{headers:(tg&&tg.initData)?{"X-Init-Data":tg.initData}:{},cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
  st.lang=d.lang==="en"?1:0;st.games=d.games||[];st.bot=d.bot||"";st.pay=!!d.pay;st.banner=d.banner||"";st.signed=!!d.signed_in;st.bal=d.balance_cents==null?null:d.balance_cents;draw();if(st.signed)account()})
 .catch(function(){st.failed=true;draw()})}
(function(){var d=document.createElement("div");d.id="snow";for(var i=0;i<18;i++){var x=document.createElement("span");x.textContent="💎";
 x.style.cssText="left:"+(Math.random()*100)+"%;font-size:"+(10+Math.random()*9)+"px;opacity:"+(.45+Math.random()*.4)+";animation-duration:"+(11+Math.random()*9)+"s,"+(3+Math.random()*3)+"s;animation-delay:-"+(Math.random()*18)+"s,0s";d.appendChild(x)}document.body.appendChild(d)})();
document.addEventListener("pointerdown",function(e){var b=e.target.closest&&e.target.closest("button,.tile,.card.buy");if(b){try{tg.HapticFeedback.impactOccurred("light")}catch(x){}}},{passive:true});
load();
})();
